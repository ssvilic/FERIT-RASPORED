<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raspored — FERIT</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E3440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Nord dark */
    --bg: #2E3440;
    --bg-panel: #3B4252;
    --bg-panel-2: #434C5E;
    --grid-line: #4C566A;
    --text: #ECEFF4;
    --text-dim: #9AA5BD;
    --accent: #88C0D0;
    --accent-cta: #88C0D0;
    --accent-cta-text: #2E3440;
    --today-bg: #5E81AC;
    --danger: #BF616A;
    /* boje po tipu nastave — tekst na svima ostaje tamni (--card-text) */
    --card-text: #2E3440;
    --type-p: #EBCB8B;   /* predavanje — žuta */
    --type-av: #A3BE8C;  /* auditorne vježbe — svijetlo zelena */
    --type-lv: #88C0D0;  /* laboratorijske vježbe — svijetlo plava */
    --type-kv: #D6939B;  /* konstrukcijske vježbe — svijetlije crvena */
    --type-unk: #B0B8C9; /* nepoznato — neutralna */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .wrap { width: 100%; margin: 0 auto; padding: 14px; }
  @media (min-width: 900px) {
    .wrap { max-width: 1100px; padding: 28px 32px; }
  }

  header.app-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 0 16px;
  }
  header.app-head h1 {
    font-size: 18px; font-weight: 600; margin: 0; color: var(--accent);
  }
  .icon-btn {
    background: var(--bg-panel); border: 1px solid var(--grid-line); color: var(--accent);
    border-radius: 8px; width: 36px; height: 36px; font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { border-color: var(--accent); }

  .week-nav {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-panel); border-radius: 12px; padding: 10px 12px;
    margin-bottom: 18px;
  }
  .week-nav .label { font-size: 13px; font-weight: 500; color: var(--accent); text-align: center; flex: 1; }
  .week-nav button { background: none; border: none; color: var(--accent); font-size: 20px; cursor: pointer; padding: 4px 10px; }
  .today-btn {
    display: block; margin: -10px auto 18px; background: none; border: 1px solid var(--accent-cta);
    color: var(--accent); border-radius: 20px; padding: 6px 16px; font-size: 13px; cursor: pointer;
    font-weight: 500;
  }

  .grid-wrap { overflow-x: auto; margin-bottom: 20px; -webkit-overflow-scrolling: touch; }
  .sched-grid {
    display: grid; grid-template-columns: 56px repeat(6, minmax(118px, 1fr));
    gap: 0; min-width: 760px;
  }
  .grid-cell.corner { background: transparent; }
  .day-col-head {
    background: var(--bg-panel); border-radius: 8px; padding: 8px 4px; text-align: center;
    margin: 0 2px 6px;
  }
  .day-col-head .wd { display: block; font-weight: 600; color: var(--accent); font-size: 13px; }
  .day-col-head .dt { display: block; font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  .day-col-head.today { background: var(--today-bg); }
  .day-col-head.today .wd, .day-col-head.today .dt { color: var(--text); }

  .time-axis { position: relative; }
  .time-axis .time-label {
    position: absolute; right: 6px; transform: translateY(-50%);
    font-size: 10px; color: var(--text-dim); text-align: right; line-height: 1.4; white-space: nowrap;
  }
  .row-lines { position: relative; }
  .row-lines .row-line {
    position: absolute; left: 0; right: 0; height: 1px; background: var(--grid-line);
  }
  .day-col { position: relative; border-left: 1px solid var(--grid-line); }
  .event-card {
    position: absolute; left: 2px; right: 2px; overflow: hidden;
    border-radius: 6px; padding: 4px 6px; color: var(--card-text);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.35) inset;
    display: block; text-decoration: none;
  }
  .ev-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .ev-time-range {
    font-size: 9.5px; font-weight: 600; color: var(--card-text); opacity: 0.75;
    letter-spacing: 0.02em; white-space: nowrap;
  }
  .ev-type-tag {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.03em; color: var(--card-text); opacity: 0.9; white-space: nowrap;
  }
  .ev-title {
    font-size: 11px; font-weight: 600; line-height: 1.25; margin-top: 1px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .ev-room {
    font-size: 10px; font-weight: 500; color: var(--card-text); opacity: 0.85; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ev-details { font-size: 12px; color: var(--card-text); opacity: 0.75; margin-top: 4px; line-height: 1.5; white-space: pre-line; }

  .empty-note, .status-note {
    font-size: 13px; color: var(--text-dim);
    padding: 20px 0; text-align: center;
  }
  .status-note.error { color: var(--danger); }

  .cal-bar {
    background: var(--bg-panel); border-radius: 12px; padding: 14px; margin: 4px 0 22px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .cal-bar button {
    background: var(--accent-cta); color: var(--accent-cta-text); border: none; border-radius: 10px;
    padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .cal-bar button.secondary { background: none; border: 1px solid var(--accent); color: var(--accent); }
  .cal-bar button:disabled { opacity: 0.5; cursor: default; }
  .cal-bar .sync-status { font-size: 12px; color: var(--text-dim); }

  .modal-back {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20;
  }
  .modal {
    background: var(--bg-panel); border: 1px solid var(--grid-line); border-radius: 14px; padding: 22px; max-width: 420px; width: 100%;
  }
  .modal h2 { font-size: 16px; margin: 0 0 14px; color: var(--accent); }
  .modal label { display: block; font-size: 12px; color: var(--text-dim); margin: 12px 0 4px; }
  .modal input {
    width: 100%; background: var(--bg-panel-2); border: 1px solid var(--grid-line); color: var(--text);
    border-radius: 8px; padding: 9px 10px; font-size: 13px;
  }
  .modal .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal button {
    flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer;
  }
  .modal button.primary { background: var(--accent-cta); color: var(--accent-cta-text); font-weight: 600; }
  .modal button.ghost { background: none; border: 1px solid var(--grid-line); color: var(--text); }
  .modal p.hint { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="app-head">
    <h1>Raspored — FERIT</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="Postavke" title="Postavke">&#9881;</button>
  </header>

  <div class="week-nav">
    <button id="prevWeek" aria-label="Prethodni tjedan">&#8592;</button>
    <div class="label" id="weekLabel">—</div>
    <button id="nextWeek" aria-label="Sljedeći tjedan">&#8594;</button>
  </div>
  <button class="today-btn" id="todayBtn">Danas</button>

  <div class="cal-bar">
    <button id="googleBtn">Prijavi se Google računom</button>
    <button id="addAllBtn" class="secondary" disabled>Dodaj prikazani tjedan u kalendar</button>
    <div class="sync-status" id="syncStatus"></div>
  </div>

  <div id="scheduleRoot">
    <div class="status-note">Učitavanje…</div>
  </div>

</div>

<div class="modal-back" id="settingsModal" style="display:none">
  <div class="modal">
    <h2>Postavke</h2>
    <label for="cfgGroup">Kod grupe (zadnji dio URL-a rasporeda, npr. 1-60)</label>
    <input id="cfgGroup" placeholder="1-60">
    <label for="cfgLvGroup">Grupa za laboratorijske vježbe (npr. RI-LV2, prazno = sve)</label>
    <input id="cfgLvGroup" placeholder="RI-LV2">
    <label for="cfgProxy">URL Cloudflare Worker proxyja</label>
    <input id="cfgProxy" placeholder="https://tvoj-worker.workers.dev">
    <label for="cfgClientId">Google OAuth Client ID</label>
    <input id="cfgClientId" placeholder="xxxx.apps.googleusercontent.com">
    <p class="hint">Client ID trebaš napraviti jednom u Google Cloud Console (OAuth consent + Web application credential). Bez njega prijava u Google radi, ali dodavanje u kalendar neće.</p>
    <div class="modal-actions">
      <button class="ghost" id="cfgCancel">Odustani</button>
      <button class="primary" id="cfgSave">Spremi</button>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const CAL_SCOPE = "https://www.googleapis.com/auth/calendar.events";
const LS = {
  group: "raspored_group",
  proxy: "raspored_proxy",
  clientId: "raspored_client_id",
  addedIds: "raspored_added_ids",
  lvGroup: "raspored_lv_group",
};

let cfg = {
  group: localStorage.getItem(LS.group) || "1-60",
  proxy: localStorage.getItem(LS.proxy) || "",
  clientId: localStorage.getItem(LS.clientId) || "",
  // grupa za laboratorijske vježbe; prazno = prikaži sve LV grupe
  lvGroup: localStorage.getItem(LS.lvGroup) ?? "RI-LV2",
};

let currentMonday = mondayOf(new Date());
let currentEvents = [];
let accessToken = null;
let tokenClient = null;

// ---------- datumi ----------
function mondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}
function fmtISODate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function fmtWeekLabel(monday) {
  const sunday = new Date(monday);
  sunday.setDate(sunday.getDate() + 6);
  const opts = { day: "2-digit", month: "2-digit", year: "numeric" };
  return `${monday.toLocaleDateString("hr-HR", opts)} – ${sunday.toLocaleDateString("hr-HR", opts)}`;
}
function zagrebDateKey(isoUtc) {
  const d = new Date(isoUtc);
  return new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Zagreb" }).format(d); // YYYY-MM-DD
}
function zagrebTime(isoUtc) {
  const d = new Date(isoUtc);
  return new Intl.DateTimeFormat("hr-HR", { timeZone: "Europe/Zagreb", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(d);
}
function zagrebDayLabel(dateKey) {
  const d = new Date(dateKey + "T12:00:00Z");
  const names = ["Ned", "Pon", "Uto", "Sri", "Čet", "Pet", "Sub"];
  const label = names[d.getUTCDay()];
  const [y, m, day] = dateKey.split("-");
  return `${label} ${day}.${m}.${y}.`;
}

// ---------- ucitavanje rasporeda ----------
async function loadWeek() {
  const root = document.getElementById("scheduleRoot");
  document.getElementById("weekLabel").textContent = fmtWeekLabel(currentMonday);

  if (!cfg.proxy) {
    root.innerHTML = `<div class="status-note error">Prvo u postavkama (⚙) unesi URL svog Cloudflare Worker proxyja.</div>`;
    return;
  }

  root.innerHTML = `<div class="status-note">Učitavanje…</div>`;
  const dateStr = fmtISODate(currentMonday);
  const url = `${cfg.proxy.replace(/\/$/, "")}/?date=${dateStr}&group=${encodeURIComponent(cfg.group)}`;

  try {
    const resp = await fetch(url);
    const data = await resp.json();
    if (data.error) {
      root.innerHTML = `<div class="status-note error">${escapeHtml(data.error)}</div>`;
      currentEvents = [];
      updateAddAllState();
      return;
    }
    currentEvents = (data.events || []).filter(ev => {
      if (!cfg.lvGroup) return true;
      if (!/\bLV\b/.test(ev.title)) return true;
      // details izgleda npr. "Grupa RI-LV1  PREZIME IME: https://..."
      const m = (ev.details || "").match(/Grupa\s+(\S+)/);
      const norm = s => s.toUpperCase().replace(/[^A-Z0-9]/g, "");
      return m ? norm(m[1]) === norm(cfg.lvGroup) : true;
    });
    renderWeek();
  } catch (err) {
    root.innerHTML = `<div class="status-note error">Ne mogu se spojiti na proxy. Provjeri URL u postavkama.</div>`;
    currentEvents = [];
    updateAddAllState();
  }
}

const TYPE_STYLE = {
  P: { label: "Predavanje", color: "var(--type-p)" },
  AV: { label: "AV", color: "var(--type-av)" },
  LV: { label: "LV", color: "var(--type-lv)" },
  KV: { label: "KV", color: "var(--type-kv)" },
  UNK: { label: "Nepoznato", color: "var(--type-unk)" },
};

// FERIT-ov "text" parametar zna izgledati npr. "Elektronika I AV - auditorne
// vježbe K2-11" ili "Matematika II Nepoznato T2-31". Iz toga izvlačimo:
// prostoriju (zadnji token oblika K2-11/T2-31...), tip nastave (P/AV/LV/KV)
// i "čisto" ime kolegija bez tih dodataka.
function parseEventTitle(title) {
  const roomMatch = title.match(/([A-ZČĆŠĐŽ]{1,4}\d[\w-]*)\s*$/);
  const room = roomMatch ? roomMatch[1] : "";
  let rest = room ? title.slice(0, title.lastIndexOf(room)).trim() : title.trim();

  let typeKey = "P";
  if (/\bAV\b/.test(rest)) typeKey = "AV";
  else if (/\bLV\b/.test(rest)) typeKey = "LV";
  else if (/\bKV\b/.test(rest)) typeKey = "KV";
  else if (/nepoznato/i.test(rest)) typeKey = "UNK";

  const course = rest
    .replace(/\b(AV|LV|KV|P)\b/, "")
    .replace(/-\s*(auditorne|laboratorijske|konstrukcijske)?\s*vježbe\s*/i, "")
    .replace(/nepoznato/i, "")
    .replace(/\s{2,}/g, " ")
    .replace(/[\s-]+$/, "")
    .trim();

  return { course: course || rest.trim(), type: TYPE_STYLE[typeKey], room };
}

// Standardni FERIT satni blokovi (90 min nastava + 15 min stanka) — koriste
// se samo za oznake vremena na lijevoj osi, ne diktiraju visinu blokova.
function buildPeriods(events) {
  const base = [
    ["08:00", "09:30"], ["09:45", "11:15"], ["11:30", "13:00"], ["13:15", "14:45"],
    ["15:00", "16:30"], ["16:45", "18:15"], ["18:30", "20:00"], ["20:15", "21:45"],
  ];
  const map = new Map(base.map(p => [p.join("|"), p]));
  events.forEach(ev => {
    const key = `${zagrebTime(ev.start)}|${zagrebTime(ev.end)}`;
    if (!map.has(key)) map.set(key, [zagrebTime(ev.start), zagrebTime(ev.end)]);
  });
  return [...map.values()].sort((a, b) => a[0].localeCompare(b[0]));
}

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}

const PX_PER_MIN = 0.85;

function renderWeek() {
  const root = document.getElementById("scheduleRoot");
  if (currentEvents.length === 0) {
    root.innerHTML = `<div class="empty-note">Za ovaj tjedan još nema objavljenog rasporeda.</div>`;
    updateAddAllState();
    return;
  }

  const dayNames = ["Ned", "Pon", "Uto", "Sri", "Čet", "Pet", "Sub"];
  const todayKey = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Zagreb" }).format(new Date());

  const days = [];
  for (let i = 0; i < 6; i++) {
    const d = new Date(currentMonday);
    d.setDate(d.getDate() + i);
    days.push(d);
  }

  const periods = buildPeriods(currentEvents);

  // Vremenski raspon osi: barem 08:00–21:45, prošireno ako neki termin ispada izvan toga.
  let dayStartMin = toMinutes(periods[0][0]);
  let dayEndMin = toMinutes(periods[periods.length - 1][1]);
  currentEvents.forEach(ev => {
    const s = toMinutes(zagrebTime(ev.start));
    const e = toMinutes(zagrebTime(ev.end));
    if (s < dayStartMin) dayStartMin = s;
    if (e > dayEndMin) dayEndMin = e;
  });
  const bodyHeight = Math.round((dayEndMin - dayStartMin) * PX_PER_MIN);

  const byDay = {};
  for (const ev of currentEvents) {
    const dKey = zagrebDateKey(ev.start);
    (byDay[dKey] = byDay[dKey] || []).push(ev);
  }

  let html = `<div class="grid-wrap"><div class="sched-grid">`;
  html += `<div class="grid-cell corner"></div>`;
  for (const d of days) {
    const dKey = fmtISODate(d);
    const isToday = dKey === todayKey;
    html += `<div class="grid-cell day-col-head ${isToday ? "today" : ""}">
      <span class="wd">${dayNames[d.getDay()]}</span>
      <span class="dt">${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.${d.getFullYear()}.</span>
    </div>`;
  }

  // Lijeva vremenska os
  html += `<div class="time-axis" style="grid-column:1; grid-row:2; height:${bodyHeight}px;">`;
  for (const [pStart] of periods) {
    const top = (toMinutes(pStart) - dayStartMin) * PX_PER_MIN;
    html += `<div class="time-label" style="top:${top}px;">${pStart}</div>`;
  }
  html += `</div>`;

  // Vodoravne linije preko svih dana, poravnate s pocetkom svakog bloka
  html += `<div class="row-lines" style="grid-column: 2 / -1; grid-row: 2; height:${bodyHeight}px;">`;
  for (const [pStart] of periods) {
    const top = (toMinutes(pStart) - dayStartMin) * PX_PER_MIN;
    html += `<div class="row-line" style="top:${top}px;"></div>`;
  }
  html += `</div>`;

  // Stupci po danima s blokovima skaliranim prema trajanju
  days.forEach((d, i) => {
    const dKey = fmtISODate(d);
    const evs = byDay[dKey] || [];
    html += `<div class="day-col" style="grid-column:${i + 2}; grid-row:2; height:${bodyHeight}px;">`;
    html += evs.map(ev => {
      const s = toMinutes(zagrebTime(ev.start));
      const e = toMinutes(zagrebTime(ev.end));
      const top = (s - dayStartMin) * PX_PER_MIN;
      const h = Math.max(34, (e - s) * PX_PER_MIN);
      const p = parseEventTitle(ev.title);
      return `
        <a class="event-card" href="${ev.calendarUrl}" target="_blank" rel="noopener"
           style="top:${top}px; height:${h}px; background:${p.type.color};" title="${escapeHtml(ev.details || "")}">
          <div class="ev-head">
            <span class="ev-time-range">${zagrebTime(ev.start)}–${zagrebTime(ev.end)}</span>
            <span class="ev-type-tag">${escapeHtml(p.type.label)}</span>
          </div>
          <div class="ev-title">${escapeHtml(p.course)}</div>
          ${p.room ? `<div class="ev-room">📍 ${escapeHtml(p.room)}</div>` : ""}
        </a>
      `;
    }).join("");
    html += `</div>`;
  });

  html += `</div></div>`;
  root.innerHTML = html;
  updateAddAllState();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------- navigacija ----------
document.getElementById("prevWeek").onclick = () => { currentMonday.setDate(currentMonday.getDate() - 7); loadWeek(); };
document.getElementById("nextWeek").onclick = () => { currentMonday.setDate(currentMonday.getDate() + 7); loadWeek(); };
document.getElementById("todayBtn").onclick = () => { currentMonday = mondayOf(new Date()); loadWeek(); };

// ---------- postavke ----------
const modal = document.getElementById("settingsModal");
document.getElementById("settingsBtn").onclick = () => {
  document.getElementById("cfgGroup").value = cfg.group;
  document.getElementById("cfgProxy").value = cfg.proxy;
  document.getElementById("cfgClientId").value = cfg.clientId;
  document.getElementById("cfgLvGroup").value = cfg.lvGroup;
  modal.style.display = "flex";
};
document.getElementById("cfgCancel").onclick = () => { modal.style.display = "none"; };
document.getElementById("cfgSave").onclick = () => {
  cfg.group = document.getElementById("cfgGroup").value.trim() || "1-60";
  cfg.proxy = document.getElementById("cfgProxy").value.trim();
  cfg.clientId = document.getElementById("cfgClientId").value.trim();
  cfg.lvGroup = document.getElementById("cfgLvGroup").value.trim();
  localStorage.setItem(LS.lvGroup, cfg.lvGroup);
  localStorage.setItem(LS.group, cfg.group);
  localStorage.setItem(LS.proxy, cfg.proxy);
  localStorage.setItem(LS.clientId, cfg.clientId);
  modal.style.display = "none";
  initGoogle();
  loadWeek();
};

// ---------- google oauth + calendar ----------
function initGoogle() {
  if (!cfg.clientId || typeof google === "undefined") return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: cfg.clientId,
    scope: CAL_SCOPE,
    callback: (resp) => {
      if (resp.error) {
        setSyncStatus("Prijava nije uspjela: " + resp.error, true);
        return;
      }
      accessToken = resp.access_token;
      document.getElementById("googleBtn").textContent = "Prijavljen u Google";
      document.getElementById("googleBtn").disabled = true;
      updateAddAllState();
    },
  });
}

document.getElementById("googleBtn").onclick = () => {
  if (!cfg.clientId) {
    setSyncStatus("Prvo u postavkama unesi Google OAuth Client ID.", true);
    return;
  }
  if (!tokenClient) initGoogle();
  tokenClient.requestAccessToken();
};

function updateAddAllState() {
  const btn = document.getElementById("addAllBtn");
  btn.disabled = !(accessToken && currentEvents.length > 0);
}

function setSyncStatus(msg, isError) {
  const el = document.getElementById("syncStatus");
  el.textContent = msg;
  el.style.color = isError ? "var(--danger)" : "var(--text-dim)";
}

document.getElementById("addAllBtn").onclick = async () => {
  if (!accessToken) return;
  const addedIds = new Set(JSON.parse(localStorage.getItem(LS.addedIds) || "[]"));
  const todo = currentEvents.filter(ev => !addedIds.has(ev.id));

  if (todo.length === 0) {
    setSyncStatus("Svi termini ovog tjedna su već dodani.");
    return;
  }

  const btn = document.getElementById("addAllBtn");
  btn.disabled = true;
  let done = 0, failed = 0;

  for (const ev of todo) {
    setSyncStatus(`Dodavanje ${done + failed + 1}/${todo.length}…`);
    try {
      const res = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${accessToken}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          summary: ev.title,
          description: ev.details || "",
          start: { dateTime: ev.start },
          end: { dateTime: ev.end },
        }),
      });
      if (res.ok) {
        addedIds.add(ev.id);
        done++;
      } else {
        failed++;
      }
    } catch (e) {
      failed++;
    }
  }

  localStorage.setItem(LS.addedIds, JSON.stringify([...addedIds]));
  setSyncStatus(`Gotovo: dodano ${done}${failed ? `, neuspjelo ${failed}` : ""}.`, failed > 0);
  updateAddAllState();
};

// ---------- pwa ----------
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

// ---------- start ----------
window.addEventListener("load", () => {
  initGoogle();
  if (!cfg.proxy) {
    document.getElementById("settingsBtn").click();
  }
  loadWeek();
});
</script>
